name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  TEST_TIMEOUT: "600"   # GitHub runners are slower than a dev box; test.sh watchdog

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils gcc gcc-multilib make python3 \
            qemu-system-x86 netcat-openbsd mtools dosfstools

      - name: Build
        run: make agentos32.img

      # Headless QEMU suites that need no OVMF, no host network services
      # and no LLM backend. The full 49-suite gate is `make test-all`.
      - name: Smoke test (serial console)
        run: make test32

      - name: Userland suites
        run: make test-jpeg test-forest test-tour test-script test-snake
