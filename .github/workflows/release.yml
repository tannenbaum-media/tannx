name: Release

# Push a tag like v2.88 and GitHub builds the boot images and attaches them
# to a release of the same name (release notes: docs/RELEASE-NOTES.md – update it before tagging).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  TEST_TIMEOUT: "600"   # GitHub runners are slower than a dev box; test.sh watchdog

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils gcc gcc-multilib make python3 python3-pil qemu-system-x86 \
            netcat-openbsd mtools dosfstools fdisk

      # python3-pil above: without it user/mkmjpeg.py cannot draw the video
      # clip and the Makefile ships an empty one (v2.88's release image had
      # no clip at LBA 1024). The toolchain versions and the hashes of the
      # parts go into the log, so a local build can be compared piece by
      # piece: the kernel is pure gas and matches byte for byte; user.bin
      # only matches with the same gcc/binutils build.
      - name: Build images
        run: |
          make agentos32.img uefi.img hybrid.img
          gcc --version | head -1; ld --version | head -1; as --version | head -1
          python3 -c "import PIL; print('PIL', PIL.__version__)"
          sha256sum kernel32.bin user.bin video.mjpg BOOTX64.EFI

      - name: Smoke test
        run: make test32

      - name: Package
        run: |
          V="${GITHUB_REF_NAME}"
          mkdir dist
          cp hybrid.img    "dist/tannx-${V}-usb-hybrid.img"
          cp agentos32.img "dist/tannx-${V}-bios.img"
          cp uefi.img      "dist/tannx-${V}-uefi.img"
          (cd dist && sha256sum *.img > SHA256SUMS)

      - uses: softprops/action-gh-release@v2
        with:
          name: TannX OS ${{ github.ref_name }}
          body_path: docs/RELEASE-NOTES.md
          files: dist/*
